name: "icingaweb2-module-toplevelview"
arch: "all"
platform: "linux"
version: "1.0.0"
release: 0
section: "default"
priority: "extra"
depends: []
maintainer: "NETWAYS <info@netways.de>"
description: |
  Icinga Web module to import data from servicenow
homepage: "https://git.netways.de/nps/c/ing-diba/icingaweb2-module-toplevelview"
license: ""

contents:
  - src: application
    dst: /usr/share/icingaweb2/modules/toplevelview/application
    file_info:
      mode: 755

  - src: library
    dst: /usr/share/icingaweb2/modules/toplevelview/library
    file_info:
      mode: 755

  - src: public
    dst: /usr/share/icingaweb2/modules/toplevelview/public
    file_info:
      mode: 755

  - src: module.info
    dst: /usr/share/icingaweb2/modules/toplevelview/module.info
    file_info:
      mode: 0644

  - src: configuration.php
    dst: /usr/share/icingaweb2/modules/toplevelview/configuration.php
    file_info:
      mode: 0644

  - src: doc
    dst: /usr/share/icingaweb2/modules/toplevelview/doc
    file_info:
      mode: 755

  - src: README.md
    dst: /usr/share/icingaweb2/modules/toplevelview/README.md
    file_info:
      mode: 0644

  - src: CHANGELOG.md
    dst: /usr/share/icingaweb2/modules/toplevelview/CHANGELOG.md
    file_info:
      mode: 0644

  - src: COPYING
    dst: /usr/share/icingaweb2/modules/toplevelview/COPYING
    file_info:
      mode: 0644

  - src: AUTHORS
    dst: /usr/share/icingaweb2/modules/toplevelview/AUTHORS
    file_info:
      mode: 0644

  - src: SECURITY.md
    dst: /usr/share/icingaweb2/modules/toplevelview/SECURITY.md
    file_info:
      mode: 0644
