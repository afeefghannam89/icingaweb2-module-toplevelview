name: Build RPM

on:
  push:
    branches:
      - *
  pull_request:
    branches:
      - main
      - release/*

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    container:
      image: goreleaser/nfpm
      options: --entrypoint ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build RPM package
        run: nfpm package --config nfpm.yaml --packager rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: |
            **/*.rpm
          retention-days: 7
